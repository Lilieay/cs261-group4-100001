">PUT /api/saved-items/{type}/{id}</text><path d="M1518,1175 L1700,1175" fill="none" stroke="#171717" stroke-width="2.3"/><path d="M1700,1175 L1700,1217" fill="none" stroke="#171717" stroke-width="2.3"/><path d="M1700,1217 L1518,1217" fill="none" stroke="#171717" stroke-width="2.3" marker-end="url(#sync)"/><text x="1725" y="1199" font-family="Leelawadee UI,Tahoma,sans-serif" font-size="29" text-anchor="start" font-weight="400">ตรวจ token ชนิด และรหัสผลงาน</text><path d="M1510,1265 L2570,1265" fill="none" stroke="#171717" stroke-width="2.3" marker-end="url(#sync)"/><text x="2040.0" y="1247" font-family="Leelawadee UI,Tahoma,sans-serif" font-size="29" text-anchor="middle" font-weight="400">ตรวจ target เพิ่ม relation หากยังไม่มี และ commit</text><path d="M2570,1355 L1510,1355" fill="none" stroke="#171717" stroke-width="2.3" stroke-dasharray="11 10" marker-end="url(#arrow)"/><text x="2040.0" y="1337" font-family="Leelawadee UI,Tahoma,sans-serif" font-size="29" text-anchor="middle" font-weight="400">ยืนยัน commit</text><path d="M1510,1445 L740,1445" fill="none" stroke="#171717" stroke-width="2.3" stroke-dasharray="11 10" marker-end="url(#arrow)"/><text x="1125.0" y="1427" font-family="Leelawadee UI,Tahoma,sans-serif" font-size="29" text-anchor="middle" font-weight="400">HTTP 200 saved:true</text><path d="M740,1535 L180,1535" fill="none" stroke="#171717" stroke-width="2.3" stroke-dasharray="11 10" marker-end="url(#arrow)"/><text x="460.0" y="1517" font-family="Leelawadee UI,Tahoma,sans-serif" font-size="29" text-anchor="middle" font-weight="400">แสดงผลสำเร็จและโหลดข้อมูลใหม่</text><path d="M45,1650 L2955,1650" fill="none" stroke="#999" stroke-width="2.3" stroke-dasharray="11 10"/><text x="2945" y="1730" font-family="Leelawadee UI,Tahoma,sans-serif" font-size="26" text-anchor="end" font-weight="400">เส้นทึบ = คำขอ   เส้นประ = ผลตอบกลับ   แท่งสี = ช่วงทำงาน</text></svg>