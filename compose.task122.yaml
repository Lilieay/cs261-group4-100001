# Test override for compose.yaml. Use only a cs261-task122-* project and mock auth.
services:
  backend:
    environment:
      TU_API_MODE: mock
  backend-b:
    extends:
      file: compose.yaml
      service: backend
    environment:
      TU_API_MODE: mock
      TU_MOCK_USERNAME: "6800000001"
    ports: !override
      - "127.0.0.1:28801:8000"
    depends_on:
      backend:
        condition: service_healthy
  frontend-b:
    extends:
      file: compose.yaml
      service: frontend
    environment:
      BACKEND_URL: "http://backend-b:8000"
    ports: !override
      - "127.0.0.1:25801:5000"
    depends_on: !override
      backend-b:
        condition: service_healthy
