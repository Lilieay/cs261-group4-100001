<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>อ่านสรุป PDF | พี่จ๋า ขอแนวข้อสอบหน่อย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/profile.css">
  <link rel="stylesheet" href="/css/summaries.css">
  <script src="/js/login-config.js" defer></script>
  <script src="/js/http-client.js" defer></script>
  <script src="/js/profile.js" defer></script>
  <script src="/js/course-api.js" defer></script>
  <script src="/js/summary-api.js" defer></script>
  <script src="/js/read-summary.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="courses.html" aria-label="หน้าแรก">
      <svg class="icon brand-icon" aria-hidden="true"><use href="/assets/icons/navbar.svg#i-file"/></svg>
      <span class="brand-copy"><b>พี่จ๋า</b><span>ขอแนวข้อสอบหน่อย</span></span>
    </a>
    <nav aria-label="เมนูหลัก">
      <a class="active" aria-current="page" href="courses.html"><svg class="icon" aria-hidden="true"><use href="/assets/icons/navbar.svg#i-search"/></svg>ค้นหา</a>
      <a href="upload.html"><svg class="icon" aria-hidden="true"><use href="/assets/icons/navbar.svg#i-upload"/></svg>อัปโหลดเอกสาร</a>
      <a href="shared-courses.html"><svg class="icon" aria-hidden="true"><use href="/assets/icons/navbar.svg#i-shared"/></svg>รายวิชาที่แบ่งปัน</a>
      <a href="saved-courses.html"><svg class="icon" aria-hidden="true"><use href="/assets/icons/navbar.svg#i-bookmark"/></svg>รายวิชาที่บันทึก</a>
    </nav>
    <div class="profile">
      <span class="avatar" data-user-avatar>?</span>
      <span class="profile-copy"><b data-user-name>กำลังโหลด…</b><small data-user-id></small></span>
      <button class="logout" type="button" data-logout aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M8 12h10"/></svg></button>
    </div>
  </header>
  <main class="summary-page summary-read">
    <a class="summary-back" id="summary-back" href="courses.html" aria-label="กลับหน้าค้นหารายวิชา"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m12 8-4 4 4 4m-4-4h8"/></svg></a>
    <noscript><p>กรุณาเปิด JavaScript เพื่ออ่านสรุป PDF</p></noscript>
    <p class="summary-status" id="summary-read-status" role="status">กำลังโหลดสรุป…</p>
    <div><button id="summary-detail-retry" type="button" hidden>ลองโหลดสรุปอีกครั้ง</button></div>
    <article id="summary-detail" hidden>
      <header class="summary-detail-heading">
        <h1 id="summary-reading-title"></h1>
        <div class="summary-credit">
          <span id="summary-instructor" hidden></span>
          <span id="summary-owner"></span>
        </div>
      </header>
      <section id="summary-viewer" class="summary-viewer" aria-label="ตัวอ่านสรุป PDF" hidden>
        <div class="summary-viewer-bar">
          <a id="summary-open-file" target="_blank" rel="noopener" aria-label="เปิด PDF ในแท็บใหม่" title="เปิด PDF ในแท็บใหม่"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m12 8 4 4-4 4m-4-4h8"/></svg></a>
          <span id="summary-file-label"></span>
          <button id="summary-fullscreen" type="button" aria-label="เต็มหน้าจอ" title="เต็มหน้าจอ" aria-pressed="false" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
        </div>
        <iframe id="summary-pdf" title="ไฟล์สรุป PDF"></iframe>
      </section>
      <div class="summary-status summary-error" id="summary-file-alert" role="alert" hidden></div>
      <button id="summary-read-retry" type="button" hidden>ลองเปิดไฟล์อีกครั้ง</button>
      <section class="summary-description" id="summary-description-box" hidden>
        <h2>ข้อมูลประกอบ</h2>
        <p id="summary-reading-description"></p>
      </section>
      <div class="summary-actions">
        <button type="button" class="summary-button" disabled><svg class="icon" aria-hidden="true"><use href="/assets/icons/navbar.svg#i-bookmark"/></svg>บันทึก</button>
        <button type="button" class="summary-button summary-primary" disabled><span aria-hidden="true">★</span>รีวิว</button>
      </div>
    </article>
  </main>
  <footer>
    <div><strong>ภาควิชาวิทยาการคอมพิวเตอร์ คณะวิทยาศาสตร์และเทคโนโลยี</strong><br>มหาวิทยาลัยธรรมศาสตร์ ศูนย์รังสิต</div>
    <div>ข้อกำหนดการใช้งาน <span>•</span> แจ้งปัญหา</div>
  </footer>
  <p id="session-status" class="session-status" role="status"></p>
</body>
</html>
